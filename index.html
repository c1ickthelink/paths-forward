<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Paths Forward Georgia</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=Source+Sans+3:wght@400;600;700&display=swap" rel="stylesheet">
<style>
/* Layout idea: a calm civic almanac. Summary first, each path on the same template, every number tagged with source + data quality. */
:root{
  --bg:#f4f6f5;
  --surface:#ffffff;
  --ink:#16201d;
  --muted:#5a6863;
  --line:#dbe2df;
  --accent:#1f6b57;      /* pine */
  --accent-soft:#e2efe9;
  --strong:#1f6b57; --strong-bg:#e2efe9;
  --limited:#8a5a00; --limited-bg:#fbefd6;
  --self:#7a3b6b;   --self-bg:#f5e4f0;
  --bar:#b9cfc6; --bar-hi:#1f6b57;
  --display:"Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
  --body:"Source Sans 3", "Segoe UI", system-ui, -apple-system, sans-serif;
  color-scheme: light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#101614; --surface:#18201d; --ink:#e7eeeb; --muted:#9db0a9; --line:#2b3733;
    --accent:#5fc3a3; --accent-soft:#1d3a31;
    --strong:#7bd3b5; --strong-bg:#1d3a31;
    --limited:#f0c069; --limited-bg:#3a2f17;
    --self:#e6a6d6; --self-bg:#3a2234;
    --bar:#2f4a41; --bar-hi:#5fc3a3;
    color-scheme: dark;
  }
}
:root[data-theme="dark"]{
  --bg:#101614; --surface:#18201d; --ink:#e7eeeb; --muted:#9db0a9; --line:#2b3733;
  --accent:#5fc3a3; --accent-soft:#1d3a31;
  --strong:#7bd3b5; --strong-bg:#1d3a31;
  --limited:#f0c069; --limited-bg:#3a2f17;
  --self:#e6a6d6; --self-bg:#3a2234;
  --bar:#2f4a41; --bar-hi:#5fc3a3;
  color-scheme: dark;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:17px;line-height:1.55}
a{color:var(--accent)}
a:focus-visible,button:focus-visible{outline:3px solid var(--accent);outline-offset:2px;border-radius:4px}
h1,h2,h3{font-family:var(--display);line-height:1.15;text-wrap:balance;margin:0}
h1{font-size:clamp(28px,4.4vw,42px);font-weight:700}
h2{font-size:24px;font-weight:700}
h3{font-size:18px;font-weight:700}
p{margin:0}
.wrap{max-width:1080px;margin:0 auto;padding:0 20px}
header.top{border-bottom:1px solid var(--line);background:var(--surface)}
.top .wrap{display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap;padding-block:14px}
.brand{font-family:var(--display);font-weight:700;font-size:20px;text-decoration:none;color:var(--ink);display:flex;align-items:center;gap:10px}
.brand .mark{width:26px;height:26px;border-radius:7px;background:var(--accent);display:grid;place-items:center;color:var(--surface);font-size:15px}
nav.main{display:flex;gap:4px;flex-wrap:wrap}
nav.main a{text-decoration:none;color:var(--muted);font-weight:600;font-size:15px;padding:6px 10px;border-radius:8px}
nav.main a[aria-current="page"],nav.main a:hover{color:var(--ink);background:var(--accent-soft)}
nav.main a.fb{background:var(--accent);color:var(--surface);margin-left:6px}
nav.main a.fb:hover{background:var(--ink);color:var(--surface)}
main{padding:32px 0 64px}
.stack{display:flex;flex-direction:column;gap:36px}
.lede{max-width:66ch;color:var(--muted);font-size:18px;margin-top:10px}
.eyebrow{font-size:13px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--accent);margin-bottom:6px}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:14px}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px;display:flex;flex-direction:column;gap:6px}
.tile .big{font-family:var(--display);font-size:34px;font-weight:700;font-variant-numeric:tabular-nums;line-height:1.05}
.tile .lbl{font-weight:600}
.tile .src{font-size:13px;color:var(--muted);margin-top:auto;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.pill{display:inline-block;font-size:12px;font-weight:700;padding:2px 8px;border-radius:999px;white-space:nowrap}
.pill.strong{color:var(--strong);background:var(--strong-bg)}
.pill.limited{color:var(--limited);background:var(--limited-bg)}
.pill.self{color:var(--self);background:var(--self-bg)}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:22px}
.panel-head{display:flex;justify-content:space-between;align-items:baseline;gap:12px;flex-wrap:wrap;margin-bottom:14px}
.muted{color:var(--muted)}
.small{font-size:14px}
.chart svg{width:100%;height:auto;display:block}
.chart text{fill:var(--ink);font-family:var(--body)}
.chart .axis{fill:var(--muted)}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:14px}
a.card{display:flex;flex-direction:column;gap:8px;text-decoration:none;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:18px;border-top:4px solid var(--accent);transition:transform .15s ease, box-shadow .15s ease}
a.card:hover{transform:translateY(-2px);box-shadow:0 6px 18px rgba(0,0,0,.08)}
a.card .go{color:var(--accent);font-weight:700;font-size:15px;margin-top:auto}
.facts{display:flex;gap:14px;flex-wrap:wrap;font-size:14px;color:var(--muted)}
.facts b{color:var(--ink);font-variant-numeric:tabular-nums}
.legend{display:flex;gap:14px;flex-wrap:wrap;align-items:center;font-size:14px}
.tablewrap{overflow-x:auto;border:1px solid var(--line);border-radius:14px;background:var(--surface)}
table{border-collapse:collapse;width:100%;min-width:860px;font-size:15px}
th,td{text-align:left;padding:12px 14px;border-bottom:1px solid var(--line);vertical-align:top}
th{font-size:13px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);background:var(--bg)}
td.num{font-variant-numeric:tabular-nums}
tr:last-child td{border-bottom:0}
td a{font-weight:700}
.two{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:14px}
.timeline{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px}
.yr{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px}
.yr .when{font-family:var(--display);font-weight:700;color:var(--accent);font-size:15px;margin-bottom:4px}
ul.clean{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:6px}
.grades{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:14px}
.grade{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px;display:flex;flex-direction:column;gap:10px}
.grade h3{display:flex;align-items:center;gap:10px}
.grade .band{font-size:13px;color:var(--muted);font-weight:600}
.numrows{display:flex;flex-direction:column}
.numrow{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,.9fr) auto;gap:14px;padding:12px 0;border-bottom:1px solid var(--line);align-items:start}
.numrow:last-child{border-bottom:0}
.numrow .v{font-family:var(--display);font-weight:700;font-size:20px;font-variant-numeric:tabular-nums}
.numrow .n{font-size:14px;color:var(--muted)}
@media (max-width:620px){.numrow{grid-template-columns:1fr}}
.callout{border-left:4px solid var(--limited);background:var(--limited-bg);padding:14px 16px;border-radius:0 10px 10px 0}
.callout.ok{border-color:var(--accent);background:var(--accent-soft)}
.back{font-weight:700;text-decoration:none;font-size:15px}
.srcs{display:flex;flex-direction:column;gap:12px}
.srcs .s{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px 16px}
.srcs .s .id{font-size:12px;color:var(--muted);font-weight:700}
footer{border-top:1px solid var(--line);padding:22px 0;color:var(--muted);font-size:14px}
sup a{text-decoration:none;font-size:11px;font-weight:700}
/* Calculator */
:root{--a:var(--accent);--b:#b8680b}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--b:#f0a54a}}
:root[data-theme="dark"]{--b:#f0a54a}
.calc-profiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:14px}
.prof{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:18px;display:flex;flex-direction:column;gap:14px;border-top:4px solid var(--a)}
.prof.b{border-top-color:var(--b)}
.prof h3 .dot{display:inline-block;width:12px;height:12px;border-radius:50%;background:var(--a);margin-right:8px}
.prof.b h3 .dot{background:var(--b)}
.fgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px 12px}
label.f{display:flex;flex-direction:column;gap:4px;font-size:14px;font-weight:600}
label.f span.h{font-weight:400;color:var(--muted);font-size:12px}
input[type=number],select{font:inherit;font-size:15px;padding:7px 9px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink);width:100%}
input[type=number]:focus,select:focus{outline:2px solid var(--accent);outline-offset:1px}
fieldset{border:1px solid var(--line);border-radius:10px;padding:10px 12px 12px;margin:0}
legend{font-size:13px;font-weight:700;color:var(--muted);padding:0 6px}
.phase{display:grid;grid-template-columns:90px 1fr;gap:8px;align-items:center;margin-top:6px;font-size:14px}
.globals{display:flex;gap:16px;flex-wrap:wrap;align-items:end}
.globals label.f{min-width:170px}
.chk{display:flex;gap:8px;align-items:center;font-size:14px;max-width:420px}
.results{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:12px}
.res{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px}
.res .k{font-size:13px;color:var(--muted);font-weight:600}
.res .row{display:flex;justify-content:space-between;gap:8px;font-variant-numeric:tabular-nums;margin-top:6px}
.res .row b{font-family:var(--display)}
.ka{color:var(--a)} .kb{color:var(--b)}
.insight{font-size:17px;max-width:75ch}
/* News */
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{font:inherit;font-size:14px;font-weight:600;padding:6px 12px;border-radius:999px;border:1px solid var(--line);background:var(--surface);color:var(--ink);cursor:pointer}
.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--surface)}
.newslist{display:flex;flex-direction:column;background:var(--surface);border:1px solid var(--line);border-radius:14px}
.ni{padding:14px 18px;border-bottom:1px solid var(--line);display:flex;flex-direction:column;gap:4px}
.ni:last-child{border-bottom:0}
.ni a.t{font-weight:700;color:var(--ink);text-decoration:none}
.ni a.t:hover{color:var(--accent);text-decoration:underline}
.ni .m{font-size:13px;color:var(--muted);display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.tag{font-size:12px;font-weight:700;padding:1px 8px;border-radius:999px;background:var(--accent-soft);color:var(--accent)}
.outlook{border-left:4px solid var(--b);background:var(--surface);border-radius:0 12px 12px 0;padding:16px 18px;border-top:1px solid var(--line);border-right:1px solid var(--line);border-bottom:1px solid var(--line)}
@media (prefers-reduced-motion: reduce){a.card{transition:none}a.card:hover{transform:none}}
</style>
</head>

const CONF = {strong:"Strong data", limited:"Limited data", self:"Self-reported"};
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const pill = c => `<span class="pill ${c}">${CONF[c]}</span>`;
const srcLink = id => `<a href="#sources" title="${esc(SOURCES[id].title)}">${esc(SOURCES[id].title.split(",")[0])}, ${esc(SOURCES[id].year)}</a>`;

function legend(){
  return `<div class="legend"><span class="muted">Data quality:</span>${pill("strong")}<span class="muted small">official, large sample</span>${pill("limited")}<span class="muted small">partial, national-only, or secondary</span>${pill("self")}<span class="muted small">reported by the program itself</span></div>`;
}

function edChart(){
  const W=720, rowH=34, left=190, right=90, top=8;
  const max=2400, H=top+EDPAYS.length*rowH+30;
  const sx=v=>left+(v/max)*(W-left-right);
  let g="";
  [0,600,1200,1800,2400].forEach(t=>{
    g+=`<line x1="${sx(t)}" x2="${sx(t)}" y1="${top}" y2="${H-24}" stroke="var(--line)"/>`;
    g+=`<text class="axis" x="${sx(t)}" y="${H-6}" font-size="12" text-anchor="middle">$${t.toLocaleString()}</text>`;
  });
  EDPAYS.forEach(([lbl,v],i)=>{
    const y=top+i*rowH, hi=(lbl==="Bachelor's"||lbl==="High school diploma");
    g+=`<text x="${left-10}" y="${y+21}" font-size="14" text-anchor="end" ${hi?'font-weight="700"':''}>${esc(lbl)}</text>`;
    g+=`<rect x="${left}" y="${y+6}" width="${sx(v)-left}" height="22" rx="4" fill="${hi?'var(--bar-hi)':'var(--bar)'}"/>`;
    g+=`<text x="${sx(v)+8}" y="${y+22}" font-size="14" font-weight="700">$${v.toLocaleString()}</text>`;
  });
  return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Median weekly earnings by education, 2025">${g}</svg>`;
}

function simulate(p, r, endAge, loanFromSavings){
  const out=[]; let port=0, loan=0, cumInc=0, early=0;
  const rr=r/100, lr=p.rate/100;
  const [s0,s1]=p.school, yrs=Math.max(1,s1-s0);
  let payment=0;
  const phases=[...p.phases].sort((a,b)=>a[0]-b[0]);
  for(let age=16; age<=endAge; age++){
    // income
    let ph=phases[0]; for(const x of phases){ if(age>=x[0]) ph=x; }
    const income = age<ph[0] ? 0 : ph[1]*Math.pow(1+p.raise/100, age-ph[0]);
    // loans: borrow evenly during school, interest accrues, then amortize
    loan *= (1+lr);
    if(p.debt>0 && age>=s0 && age<s1) loan += p.debt/yrs;
    let pay=0;
    if(p.debt>0 && age===s1){ payment = lr===0 ? loan/p.term : loan*lr/(1-Math.pow(1+lr,-p.term)); }
    if(p.debt>0 && age>=s1 && loan>0.5){ pay=Math.min(payment, loan); loan-=pay; }
    // savings
    let contrib = age>=p.saveStart ? income*p.savePct/100 : 0;
    if(loanFromSavings) contrib=Math.max(0, contrib-pay);
    port = port*(1+rr) + contrib;
    if(age<22) early += contrib*Math.pow(1+rr, endAge-age);
    cumInc += income;
    out.push({age, income, port, loan, net:port-loan, cumInc, pay});
  }
  return {rows:out, early};
}

function calculator(){
  return `<div class="stack">
    <section><a class="back" href="#home">← Overview</a><h1 style="margin-top:10px">What-if calculator</h1>
      <p class="lede">Build two paths and see how income, investing, and debt add up over a working life. It's a thinking tool, not a forecast: every input is an assumption you can change.</p></section>
    <section class="panel"><div class="globals">
      <label class="f" for="g-r">Investment return per year (%)<span class="h">After inflation. Stock market long-run is often cited ~5–7%.</span><input type="number" id="g-r" step="0.5" min="0" max="12" value="${CALC.r}" data-g="r"></label>
      <label class="f" for="g-end">Project through age<input type="number" id="g-end" min="30" max="75" value="${CALC.end}" data-g="end"></label>
      <label class="chk" for="g-loan"><input type="checkbox" id="g-loan" data-g="loan" ${CALC.loanFromSavings?"checked":""}> Loan payments come out of the money they'd otherwise invest</label>
    </div></section>
    <div class="calc-profiles">${profForm("A")}${profForm("B")}</div>
    <div id="calc-out"></div>
    <div class="callout"><b>What this leaves out.</b> Taxes, emergencies, job loss, and market crashes; employer benefits like Publix stock or 401(k) matches; scholarships and HOPE; and the fact that a higher earner can choose to save more. Returns are smooth averages; real markets aren't. All figures are in today's dollars.</div>
  </div>`;
}

function calcChart(a,b){
  const W=760,H=320,L=64,R=20,T=16,Bm=34;
  const all=[...a.rows,...b.rows].map(x=>x.net);
  let max=Math.max(...all,1), min=Math.min(...all,0);
  const step=niceStep((max-min)/5); max=Math.ceil(max/step)*step; min=Math.floor(min/step)*step;
  const a0=16,a1=CALC.end;
  const sx=v=>L+(v-a0)/(a1-a0)*(W-L-R), sy=v=>T+(max-v)/(max-min)*(H-T-Bm);
  let g="";
  for(let v=min; v<=max+1; v+=step){ g+=`<line x1="${L}" x2="${W-R}" y1="${sy(v)}" y2="${sy(v)}" stroke="var(--line)" ${v===0?'stroke-width="2"':''}/><text class="axis" x="${L-8}" y="${sy(v)+4}" font-size="12" text-anchor="end">${money(v)}</text>`; }
  for(let t=20;t<=a1;t+=5){ if(t<a0)continue; g+=`<text class="axis" x="${sx(t)}" y="${H-10}" font-size="12" text-anchor="middle">${t}</text>`; }
  const line=(rows,c)=>{ const d=rows.map((x,i)=>`${i?"L":"M"}${sx(x.age).toFixed(1)},${sy(x.net).toFixed(1)}`).join(""); const e=rows[rows.length-1];
    return `<path d="${d}" fill="none" stroke="${c}" stroke-width="3" stroke-linejoin="round"/><circle cx="${sx(e.age)}" cy="${sy(e.net)}" r="5" fill="${c}"/>`; };
  g+=line(a.rows,"var(--a)")+line(b.rows,"var(--b)");
  g+=`<text class="axis" x="${(L+W-R)/2}" y="${H}" font-size="12" text-anchor="middle" dy="-0">Age</text>`;
  return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Projected net worth by age for both profiles">${g}</svg>`;
}
function niceStep(raw){ const p=Math.pow(10,Math.floor(Math.log10(raw||1))); const n=raw/p; return (n<=1?1:n<=2?2:n<=5?5:10)*p; }

function renderCalc(){
  const el=document.getElementById("calc-out"); if(!el) return;
  const a=simulate(CALC.A,CALC.r,CALC.end,CALC.loanFromSavings), b=simulate(CALC.B,CALC.r,CALC.end,CALC.loanFromSavings);
  const at=(s,age)=>s.rows.find(x=>x.age===age)||s.rows[s.rows.length-1];
  const marks=[22,30,45,CALC.end].filter((v,i,arr)=>v<=CALC.end && arr.indexOf(v)===i);
  // crossover: last age where the lead changes
  let cross=null; for(let i=1;i<a.rows.length;i++){ const d0=a.rows[i-1].net-b.rows[i-1].net, d1=a.rows[i].net-b.rows[i].net; if((d0<0)!==(d1<0)) cross={age:a.rows[i].age, leader:d1>0?"A":"B"}; }
  const endA=at(a,CALC.end), endB=at(b,CALC.end);
  const leader = endA.net>=endB.net?"A":"B", gap=Math.abs(endA.net-endB.net);
  const earlyP = a.early>=b.early ? ["A",a,endA] : ["B",b,endB];
  const earlyShare = earlyP[2].port>0 ? Math.round(earlyP[1].early/earlyP[2].port*100) : 0;
  const nm=id=>`<b class="k${id.toLowerCase()}">Profile ${id}</b>`;
  let ins = `By age ${CALC.end}, ${nm(leader)} is ahead by about <b>${money(gap)}</b> in projected net worth.`;
  if(cross) ins += ` The lead last changed hands at age <b>${cross.age}</b>, when ${nm(cross.leader)} pulled ahead.`;
  if(earlyP[1].early>1000) ins += ` For ${nm(earlyP[0])}, money invested <b>before age 22</b> grows to about <b>${money(earlyP[1].early)}</b> by ${CALC.end}, roughly ${earlyShare}% of that portfolio. That is the early-start effect.`;
  el.innerHTML = `<div class="stack" style="gap:14px">
    <section class="panel chart"><div class="panel-head"><div><h2>Projected net worth</h2><p class="muted small" style="margin-top:4px">Investments minus student loan balance, today's dollars</p></div>
      <div class="legend"><span><span class="kb" style="color:var(--a)">●</span> Profile A</span><span><span style="color:var(--b)">●</span> Profile B</span></div></div>
      ${calcChart(a,b)}
      <p class="insight" style="margin-top:12px">${ins}</p></section>
    <div class="results">${marks.map(m=>{const x=at(a,m),y=at(b,m);return `<div class="res"><div class="k">At age ${m}</div>
      <div class="row"><span class="ka">A net worth</span><b>${money(x.net)}</b></div>
      <div class="row"><span class="kb">B net worth</span><b>${money(y.net)}</b></div>
      <div class="row small muted"><span>Earned so far A / B</span><span>${money(x.cumInc)} / ${money(y.cumInc)}</span></div>
      ${(x.loan>1||y.loan>1)?`<div class="row small muted"><span>Loan left A / B</span><span>${money(x.loan)} / ${money(y.loan)}</span></div>`:""}</div>`;}).join("")}</div>
  </div>`;
}

function bindCalc(){
  const v=document.getElementById("view");
  v.oninput = v.onchange = e=>{
    const t=e.target; const P=t.dataset.p, k=t.dataset.k, G=t.dataset.g;
    if(G){ if(G==="loan") CALC.loanFromSavings=t.checked; else { const n=parseFloat(t.value); if(!isNaN(n)) CALC[G]= G==="end"? Math.min(75,Math.max(30,Math.round(n))) : n; } renderCalc(); return; }
    if(!P) return;
    const p=CALC[P];
    if(k==="preset"){ if(e.type!=="change") return; CALC[P]=JSON.parse(JSON.stringify({key:t.value,...PRESETS[t.value]})); route(true); return; }
    const n=parseFloat(t.value); if(isNaN(n)) return;
    if(k==="pa") p.phases[+t.dataset.i][0]=n;
    else if(k==="ps") p.phases[+t.dataset.i][1]=n;
    else if(k==="s1") p.school[1]=n;
    else p[k]=n;
    renderCalc();
  };
}

/* =========================================================
   WHAT'S CHANGING — reads news.json written by the daily GitHub Action
   ========================================================= */
const TAGNAMES = {college:"College", technical:"Trades & technical", apprenticeship:"Apprenticeship", military:"Military", work:"Work path", entrepreneurship:"Entrepreneurship", ai:"AI & automation"};
const NEWS = {data:null, error:null, filter:"all", loading:false};

function loadNews(){
  if(NEWS.data || NEWS.loading) return;
  NEWS.loading = true;
  fetch("news.json", {cache:"no-store"})
    .then(r=>{ if(!r.ok) throw new Error("HTTP "+r.status); return r.json(); })
    .then(d=>{ NEWS.data=d; })
    .catch(e=>{ NEWS.error=String(e); })
    .finally(()=>{ NEWS.loading=false; renderNews(); });
}

function newsPage(){
  const chips = [["all","Everything"],...Object.entries(TAGNAMES)].map(([k,v])=>`<button class="chip" type="button" data-nf="${k}" aria-pressed="${NEWS.filter===k}">${esc(v)}</button>`).join("");
  return `<div class="stack">
    <section><a class="back" href="#home">← Overview</a><h1 style="margin-top:10px">What's changing</h1>
      <p class="lede">The rest of this site looks back at what already happened. This page collects recent releases and research from a short list of reputable labor-market sources, so you can see where things may be heading. Headlines link to the original; nothing here is a prediction.</p></section>
    <div class="chips" role="group" aria-label="Filter by path">${chips}</div>
    <div id="news-out"><p class="muted">Loading…</p></div>
    <div class="callout"><b>How to read this.</b> One study or one month of data rarely changes the picture. Look for the same direction showing up across several sources over time. Research groups also publish opinion pieces; the source label tells you who said it.</div>
  </div>`;
}

function renderNews(){
  const el=document.getElementById("news-out"); if(!el) return;
  if(NEWS.loading){ el.innerHTML=`<p class="muted">Loading…</p>`; return; }
  if(NEWS.error || !NEWS.data){ el.innerHTML=`<div class="callout">The news feed isn't available in this view. It loads on the live site, where a daily update writes it.</div>`; return; }
  const d=NEWS.data;
  if(!d.updated){ el.innerHTML=`<div class="callout">The first daily update hasn't run yet. Check back tomorrow.</div>`; return; }
  const items=d.items.filter(i=>NEWS.filter==="all"||i.tags.includes(NEWS.filter));
  const upd=new Date(d.updated);
  const okN=d.sources.filter(s=>s.ok).length;
  const fmt=s=>s? new Date(s+"T12:00:00").toLocaleDateString(undefined,{month:"short",day:"numeric",year:"numeric"}) : "Undated";
  el.innerHTML = `<div class="stack" style="gap:12px">
    <p class="muted small">Updated ${upd.toLocaleDateString(undefined,{month:"long",day:"numeric",year:"numeric"})} · ${okN} of ${d.sources.length} sources responded · ${items.length} item${items.length===1?"":"s"}${NEWS.filter!=="all"?" tagged "+esc(TAGNAMES[NEWS.filter]):""}</p>
    ${items.length? `<div class="newslist">${items.map(i=>`<div class="ni"><a class="t" href="${esc(i.url)}" target="_blank" rel="noopener">${esc(i.title)}</a>
      <div class="m"><span>${esc(i.source)}</span><span aria-hidden="true">·</span><span>${fmt(i.date)}</span>${i.tags.map(t=>`<span class="tag">${esc(TAGNAMES[t]||t)}</span>`).join("")}</div></div>`).join("")}</div>`
      : `<div class="callout ok">Nothing recent with this tag. Try "Everything."</div>`}
    <details><summary class="small muted">Source status</summary><ul class="clean small" style="margin-top:8px">${d.sources.map(s=>`<li>${esc(s.name)}: ${s.ok? s.count+" item"+(s.count===1?"":"s") : "<span style='color:var(--limited)'>didn't respond</span>"}</li>`).join("")}</ul></details>
  </div>`;
}

function bindNews(){
  const v=document.getElementById("view");
  v.onclick = e=>{ const b=e.target.closest("[data-nf]"); if(!b) return; NEWS.filter=b.dataset.nf;
    document.querySelectorAll("[data-nf]").forEach(c=>c.setAttribute("aria-pressed", String(c.dataset.nf===NEWS.filter))); renderNews(); };
}

function route(keepScroll){
  const h = (location.hash||"#home").slice(1);
  const v = document.getElementById("view");
  const p = PATHS.find(x=>x.id===h);
  v.oninput = v.onchange = v.onclick = null;
  v.innerHTML = h==="compare"?compare(): h==="sources"?sources(): h==="calculator"?calculator(): h==="news"?newsPage(): p?pathPage(p): home();
  if(h==="calculator"){ bindCalc(); renderCalc(); }
  if(h==="news"){ bindNews(); renderNews(); loadNews(); }
  document.querySelectorAll("nav.main a").forEach(a=>{
    const t=a.getAttribute("href").slice(1);
    if(t===h || (t==="home" && !["compare","sources","calculator","news"].includes(h))) a.setAttribute("aria-current","page"); else a.removeAttribute("aria-current");
  });
  document.title = (p? p.name+" · " : h==="compare"?"Compare paths · ": h==="sources"?"Sources · ": h==="calculator"?"Calculator · ": h==="news"?"What's changing · ":"") + "Paths Forward Georgia";
  if(keepScroll!==true) window.scrollTo(0,0);
}
window.addEventListener("hashchange", ()=>route());
route();
</script>
</body>
