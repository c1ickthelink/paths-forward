name: Update news feed

on:
  schedule:
    - cron: "17 11 * * *"   # daily, ~6:17 AM Eastern
  workflow_dispatch:         # "Run workflow" button in the Actions tab

permissions:
  contents: write

concurrency:
  group: news-feed
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Fetch feeds
        run: python3 news/fetch_news.py

      - name: Commit if changed
        run: |
          if git diff --quiet -- news.json; then
            echo "No changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add news.json
          git commit -m "Update news feed"
          git push
